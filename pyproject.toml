[project]
name = "ashare-lab"
version = "0.1.0"
description = "A local-first A-share quantitative research workbench for individual investors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "fastapi>=0.116",
    "httpx2[brotli,http2,zstd]>=0.1",
    "numpy>=2.2",
    "polars>=1.31",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pymongo>=4.10",
    "rich>=14",
    "scikit-learn>=1.7",
    "typer>=0.16",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "httpx2>=0.1",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "scikit-learn-stubs>=0.0.3",
]

[project.scripts]
ashare-lab = "ashare_lab.main:run"
ashare-data = "ashare_lab.data.cli:run"
ashare-coverage = "ashare_lab.coverage_cli:run"
ashare-research = "ashare_lab.research_cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_lab"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
exclude = ["**/__pycache__", "**/.venv"]
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "ISC001",
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ashare_lab"]
branch = true
omit = ["src/ashare_lab/data/cli.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
